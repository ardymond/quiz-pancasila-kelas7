<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Pendidikan Pancasila VII</title><style>body{font:16px system-ui;background:#f2f6f3;color:#18251f;margin:0;padding:20px}.card{max-width:700px;margin:20px auto;background:white;padding:28px;border-radius:18px;box-shadow:0 5px 24px #0001}h1{color:#246b55}.muted{color:#66736c}.option{display:block;width:100%;text-align:left;background:white;border:1px solid #ccd8d1;border-radius:10px;padding:14px;margin:9px 0;font:inherit;cursor:pointer}.option.sel{background:#eaf5ef;border:2px solid #246b55}button.go{width:100%;padding:14px;background:#246b55;color:white;border:0;border-radius:10px;font-weight:bold;font-size:1rem;margin-top:18px}button:disabled{opacity:.4}#result{display:none}.score{font-size:3rem;color:#246b55;font-weight:bold;text-align:center} .review{border-top:1px solid #ddd;padding:12px 0}</style><div class="card"><small>LATIHAN MANDIRI • KELAS VII</small><h1>Quiz Pendidikan Pancasila</h1><p class="muted">Sejarah Kelahiran Pancasila dan Penerapan Nilai-Nilai Pancasila</p><section id="quiz"><b id="count"></b><p id="q"></p><div id="opts"></div><button class="go" id="next" disabled>Jawab & lanjutkan →</button></section><section id="result"><h2>Quiz selesai!</h2><div class="score" id="score"></div><p id="summary"></p><button class="go" id="reviewBtn">Lihat kunci jawaban</button><div id="review"></div><button class="go" id="again">Ulangi quiz</button></section></div><script>
const D=[
["Tanggal 1 Juni 1945 diperingati sebagai hari lahir Pancasila karena Ir. Soekarno menyampaikan pidato tentang…",["Kemerdekaan Indonesia","Dasar negara Indonesia","Pembentukan BPUPK","Pembentukan PPKI"],1],
["Ketua BPUPK adalah…",["Ir. Soekarno","Mohammad Hatta","Dr. Radjiman Wedyodiningrat","Mohammad Yamin"],2],
["Sidang pertama BPUPK membahas…",["Rancangan undang-undang","Dasar negara Indonesia","Pembentukan kabinet","Pemilihan presiden"],1],
["BPUPK dibentuk pada tanggal…",["1 Maret 1945","29 Mei 1945","17 Agustus 1945","18 Agustus 1945"],0],
["Tokoh yang menyampaikan pidato dasar negara pada 1 Juni 1945 adalah…",["Mohammad Hatta","Mohammad Yamin","Ir. Soekarno","Radjiman Wedyodiningrat"],2],
["Panitia Sembilan dibentuk untuk…",["Menyusun teks proklamasi","Merumuskan dasar negara","Membentuk tentara nasional","Memilih presiden dan wakil presiden"],1],
["Hasil rumusan Panitia Sembilan pada 22 Juni 1945 disebut…",["Pembukaan UUD 1945","Piagam Jakarta","Proklamasi Kemerdekaan","Dekret Presiden"],1],
["Sikap para tokoh saat merumuskan dasar negara adalah…",["Memaksakan pendapat","Mengutamakan kepentingan pribadi","Bermusyawarah mencapai kesepakatan","Menolak pendapat berbeda"],2],
["Proklamasi Kemerdekaan Indonesia dilaksanakan pada…",["1 Juni 1945","22 Juni 1945","17 Agustus 1945","18 Agustus 1945"],2],
["Pengetik naskah Proklamasi adalah…",["Sayuti Melik","Ahmad Soebardjo","Mohammad Hatta","Sukarni"],0],
["Pancasila disahkan sebagai dasar negara oleh PPKI pada…",["1 Juni 1945","17 Agustus 1945","18 Agustus 1945","22 Juni 1945"],2],
["Lambang sila pertama adalah…",["Rantai","Bintang","Pohon beringin","Kepala banteng"],1],
["Lambang sila kedua adalah…",["Padi dan kapas","Rantai","Bintang","Pohon beringin"],1],
["Lambang sila ketiga adalah…",["Kepala banteng","Padi dan kapas","Pohon beringin","Rantai"],2],
["Lambang sila keempat adalah…",["Bintang","Pohon beringin","Kepala banteng","Padi dan kapas"],2],

["Bersikap adil memberikan hak kepada orang lain menerapkan sila…",["Pertama","Kedua","Ketiga","Kelima"],3]
];let i=0,chosen=null,A=[];const $=x=>document.getElementById(x);function draw(){let [q,o]=D[i];$("count").textContent=`Soal ${i+1} dari ${D.length}`;$("q").textContent=q;$("opts").innerHTML="";o.forEach((t,j)=>{let b=document.createElement("button");b.className="option";b.textContent="ABCD"[j]+". "+t;b.onclick=()=>{chosen=j;[...$("opts").children].forEach((e,k)=>e.classList.toggle("sel",k===j));$("next").disabled=false};$("opts").append(b)});$("next").disabled=true;$("next").textContent=i===D.length-1?"Selesaikan quiz":"Jawab & lanjutkan →";chosen=null}$("next").onclick=()=>{A.push(chosen);i++;if(i===D.length)finish();else draw()};function finish(){let n=A.filter((x,j)=>x===D[j][2]).length;$("quiz").style.display="none";$("result").style.display="block";$("score").textContent=n*5+"/100";$("summary").textContent=`${n} benar dari 20 soal. `+(n>=18?"Luar biasa!":n>=15?"Bagus!":"Terus berlatih!");$("review").innerHTML=D.map(([q,o,a],j)=>`<div class="review"><b>${j+1}. ${q}</b><p>Jawaban benar: ${"ABCD"[a]}. ${o[a]}</p>${A[j]!==a?`<small>Jawabanmu: ${"ABCD"[A[j]]}. ${o[A[j]]}</small>`:"<small>Benar ✓</small>"}</div>`).join("");$("review").style.display="none"}$("reviewBtn").onclick=()=>{$("review").style.display=$("review").style.display==="none"?"block":"none"};$("again").onclick=()=>{i=0;A=[];$("result").style.display="none";$("quiz").style.display="block";draw();scrollTo(0,0)};draw();
